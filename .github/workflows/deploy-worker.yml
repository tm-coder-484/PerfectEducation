# Deploys the Cloudflare Worker whenever anyone pushes to i-dont-know.
#
# Goes in the PerfectEducation repo as .github/workflows/deploy-worker.yml
#
# Why it builds the frontend here rather than letting the Worker fetch it:
# the Worker's sync script pulls the LAST COMMITTED dist/ from this repo, so a
# push that only touches src/ would redeploy the old frontend. Building from
# source means what gets deployed is what was actually pushed - by anyone, not
# just whoever last remembered to commit a build.
name: Deploy Worker

on:
  push:
    branches: [i-dont-know]
  workflow_dispatch:

# One deploy at a time. Not cancel-in-progress: killing wrangler part-way
# through an upload is worse than waiting for it to finish.
concurrency:
  group: deploy-worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check out the frontend
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build the frontend
        run: |
          npm ci
          npm run build

      - name: Check out the Worker
        uses: actions/checkout@v4
        with:
          repository: tm-coder-484/perfecteducation-worker
          ref: main
          # Only needed while that repo is private. Make it public and this
          # line (and the secret) can go.
          token: ${{ secrets.WORKER_REPO_TOKEN }}
          path: worker

      - name: Assemble the assets
        run: |
          set -euo pipefail
          mkdir -p worker/public
          cp -R dist/. worker/public/

          # main.py served these out of its own directory rather than dist/,
          # so a plain copy of dist/ misses them.
          [ -f python-backend/favicon.svg ] && cp python-backend/favicon.svg worker/public/
          if [ -d python-backend/assets/images ]; then
            mkdir -p worker/public/assets/images
            cp -R python-backend/assets/images/. worker/public/assets/images/
          fi

          echo "assets: $(find worker/public -type f | wc -l) file(s)"

      - name: Bundle the current lessons.json into the Worker
        # The API serves this from inside the Worker bundle, not from disk, so
        # edits to it are invisible until it is copied across and redeployed.
        run: cp python-backend/lessons.json worker/src/lessons.json

      - name: Sanity-check before deploying
        working-directory: worker
        run: |
          set -euo pipefail
          test -f public/index.html || { echo "no index.html - the build produced nothing"; exit 1; }
          node -e "JSON.parse(require('fs').readFileSync('src/lessons.json','utf8'))"
          npm ci
          npm test

      - name: Deploy
        working-directory: worker
        env:
          # Keeps wrangler's [build] hook from wiping the assets built above
          # and re-downloading the last committed dist/ over the top of them.
          SKIP_SYNC: "1"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
